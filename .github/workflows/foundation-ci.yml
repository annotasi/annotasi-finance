name: Foundation CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Eight foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 1. Deterministic install
        run: pnpm install --frozen-lockfile

      - name: 2. Format check
        run: pnpm format:check

      - name: 3. Lint
        run: pnpm lint

      - name: 4. Typecheck
        run: pnpm typecheck

      - name: 5. Smoke unit tests
        run: pnpm test

      - name: 6. Architecture-boundary checks
        run: pnpm boundaries

      - name: 7. Web build
        run: pnpm build:web

      - name: 8. API build
        run: pnpm build:api

  database-foundation:
    name: Database foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: Migration, RLS, and exact BIGINT evidence
        run: pnpm ci:database

  identity-session:
    name: Identity and session checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [foundation, database-foundation]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: IAM unit, property, PostgreSQL integration, API/security, and frontend evidence
        run: pnpm ci:iam

  onboarding-isolation:
    name: Onboarding and isolation checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [foundation, database-foundation, identity-session]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: IAM-002 unit, PostgreSQL concurrency/RLS, real HTTP security, and browser evidence
        run: pnpm ci:iam2

  account-management:
    name: Account management checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      [foundation, database-foundation, identity-session, onboarding-isolation]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Deterministic install
        run: pnpm install --frozen-lockfile

      - name: ACC-001 unit/property, PostgreSQL RLS/concurrency, real HTTP security, and browser evidence
        run: pnpm ci:acc1
